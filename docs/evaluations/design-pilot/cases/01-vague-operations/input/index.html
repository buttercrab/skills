<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Harbor operations</title>
<style>:root{--ink:#18252a;--accent:#186b64;--paper:#f4f5ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px system-ui,sans-serif}header,main{padding:24px;max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #cbd1cb}nav a{margin-left:14px;color:inherit}h1{font-size:32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article,.panel{padding:20px;background:white;border:1px solid #ccd3ce;border-radius:10px}button,select,input{font:inherit;padding:9px 12px}button{cursor:pointer;background:var(--accent);color:white;border:0;border-radius:5px}button.secondary{background:#dce4de;color:var(--ink)}label{display:inline-block;margin:8px 12px 8px 0}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}.muted{color:#586761}.status{min-height:24px;margin:12px 0}.toolbar{margin:20px 0}[hidden]{display:none!important}@media(max-width:650px){header{display:block}nav a{margin:0 12px 0 0}.grid{grid-template-columns:1fr}main{padding:16px}}</style>
<header><strong>Harbor</strong><nav><a href="#main">Workspace</a><a href="#help">Help</a></nav></header>
<main id="main"><h1>Operations dashboard</h1><p class="muted">Team overview</p><div class="grid"><article><h2>Revenue</h2><strong>$42,100</strong></article><article><h2>Open orders</h2><strong>47</strong></article><article><h2>Late pickups</h2><strong>6</strong></article></div><section class="panel toolbar"><h2>Recent orders</h2><label>Status <select id="filter"><option>All</option><option>Late</option><option>Ready</option></select></label><table><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><p id="notice" class="status" aria-live="polite"></p></section><p id="help" class="muted">Local demo · No data leaves this page.</p></main><script>const orders=[{id:'H-104',name:'Kite Cafe',status:'Late'},{id:'H-105',name:'Moss Studio',status:'Ready'},{id:'H-106',name:'Paper Finch',status:'Late'}];function render(){rows.innerHTML=orders.filter(o=>filter.value==='All'||o.status===filter.value).map(o=>`<tr><td>${o.id}</td><td>${o.name}</td><td>${o.status}</td><td><button data-id="${o.id}">Mark collected</button></td></tr>`).join('')||'<tr><td colspan="4">No orders in this view.</td></tr>'}filter.onchange=render;rows.onclick=e=>{const o=orders.find(o=>o.id===e.target.dataset.id);if(o){o.status='Collected';notice.textContent=o.id+' marked collected.';render()}};render();</script></html>
