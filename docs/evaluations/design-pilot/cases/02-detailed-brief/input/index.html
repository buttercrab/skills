<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loom workshop booking</title>
<style>:root{--ink:#18252a;--accent:#186b64;--paper:#f4f5ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px system-ui,sans-serif}header,main{padding:24px;max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #cbd1cb}nav a{margin-left:14px;color:inherit}h1{font-size:32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article,.panel{padding:20px;background:white;border:1px solid #ccd3ce;border-radius:10px}button,select,input{font:inherit;padding:9px 12px}button{cursor:pointer;background:var(--accent);color:white;border:0;border-radius:5px}button.secondary{background:#dce4de;color:var(--ink)}label{display:inline-block;margin:8px 12px 8px 0}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}.muted{color:#586761}.status{min-height:24px;margin:12px 0}.toolbar{margin:20px 0}[hidden]{display:none!important}@media(max-width:650px){header{display:block}nav a{margin:0 12px 0 0}.grid{grid-template-columns:1fr}main{padding:16px}}</style>
<header><strong>Loom</strong><nav><a href="#main">Workspace</a><a href="#help">Help</a></nav></header>
<main id="main"><h1>Book a workshop</h1><p>Make something this weekend.</p><div class="grid"><article><h2>Handbuilding</h2><p>Saturday · 10:00 · $45</p><button class="choose" data-name="Handbuilding" data-price="45">Choose</button></article><article><h2>Glazing</h2><p>Sunday · 14:00 · $35</p><button class="choose" data-name="Glazing" data-price="35">Choose</button></article></div><section class="panel toolbar"><h2>Your booking</h2><p id="selection">No workshop selected</p><label>Seats <input id="seats" type="number" min="1" max="4" value="1"></label><p id="total">Total: $0</p><button id="book">Confirm booking</button><p id="notice" class="status" aria-live="polite"></p></section><p id="help" class="muted">Local demo · No data leaves this page.</p></main><script>let chosen=null;function update(){total.textContent='Total: $'+(chosen?chosen.price*Number(seats.value):0)}document.querySelectorAll('.choose').forEach(b=>b.onclick=()=>{chosen={name:b.dataset.name,price:Number(b.dataset.price)};selection.textContent=chosen.name;update()});seats.oninput=update;book.onclick=()=>notice.textContent=chosen?'Booking confirmed for '+seats.value+' seat(s) in '+chosen.name+'.':'Choose a workshop first.';</script></html>
