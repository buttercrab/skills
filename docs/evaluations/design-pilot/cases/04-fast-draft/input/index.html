<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sprout volunteer signup</title>
<style>:root{--ink:#18252a;--accent:#186b64;--paper:#f4f5ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px system-ui,sans-serif}header,main{padding:24px;max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #cbd1cb}nav a{margin-left:14px;color:inherit}h1{font-size:32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article,.panel{padding:20px;background:white;border:1px solid #ccd3ce;border-radius:10px}button,select,input{font:inherit;padding:9px 12px}button{cursor:pointer;background:var(--accent);color:white;border:0;border-radius:5px}button.secondary{background:#dce4de;color:var(--ink)}label{display:inline-block;margin:8px 12px 8px 0}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}.muted{color:#586761}.status{min-height:24px;margin:12px 0}.toolbar{margin:20px 0}[hidden]{display:none!important}@media(max-width:650px){header{display:block}nav a{margin:0 12px 0 0}.grid{grid-template-columns:1fr}main{padding:16px}}</style>
<header><strong>Sprout</strong><nav><a href="#main">Workspace</a><a href="#help">Help</a></nav></header>
<main id="main"><h1>Join a garden shift</h1><p>Saturday mornings at the community garden.</p><section class="panel"><label>Your name <input id="name"></label><label>Shift <select id="shift"><option>09:00 — Watering</option><option>11:00 — Harvest</option></select></label><button id="join">Join shift</button><p id="notice" class="status" aria-live="polite"></p></section><p id="help" class="muted">Local demo · No data leaves this page.</p></main><script>join.onclick=()=>notice.textContent=document.querySelector('#name').value.trim()?'You are on the list for '+shift.value+'.':'Enter your name to join.';</script></html>
