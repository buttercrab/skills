<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nightjar reading room</title>
<style>:root{--ink:#18252a;--accent:#186b64;--paper:#f4f5ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px system-ui,sans-serif}header,main{padding:24px;max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #cbd1cb}nav a{margin-left:14px;color:inherit}h1{font-size:32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article,.panel{padding:20px;background:white;border:1px solid #ccd3ce;border-radius:10px}button,select,input{font:inherit;padding:9px 12px}button{cursor:pointer;background:var(--accent);color:white;border:0;border-radius:5px}button.secondary{background:#dce4de;color:var(--ink)}label{display:inline-block;margin:8px 12px 8px 0}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}.muted{color:#586761}.status{min-height:24px;margin:12px 0}.toolbar{margin:20px 0}[hidden]{display:none!important}@media(max-width:650px){header{display:block}nav a{margin:0 12px 0 0}.grid{grid-template-columns:1fr}main{padding:16px}}</style>
<header><strong>Nightjar</strong><nav><a href="#main">Workspace</a><a href="#help">Help</a></nav></header>
<main id="main"><h1>Your reading room</h1><p class="muted">Three things worth a quiet hour.</p><div class="toolbar"><button id="all">All reads</button> <button id="saved" class="secondary">Saved only</button></div><div id="cards" class="grid"></div><p id="notice" class="status" aria-live="polite"></p><p id="help" class="muted">Local demo · No data leaves this page.</p></main><script>const reads=[{id:1,title:'The city after rain',type:'Essay',minutes:12},{id:2,title:'Learning to notice',type:'Interview',minutes:18},{id:3,title:'A garden at midnight',type:'Field note',minutes:9}];let savedIds=[],onlySaved=false;function render(){cards.innerHTML=reads.filter(r=>!onlySaved||savedIds.includes(r.id)).map(r=>`<article><p class="muted">${r.type} · ${r.minutes} min</p><h2>${r.title}</h2><button data-id="${r.id}">${savedIds.includes(r.id)?'Unsave':'Save for later'}</button></article>`).join('')||'<p>No saved reads yet.</p>'}cards.onclick=e=>{let id=Number(e.target.dataset.id);if(!id)return;savedIds=savedIds.includes(id)?savedIds.filter(x=>x!==id):[...savedIds,id];notice.textContent='Saved list updated.';render()};all.onclick=()=>{onlySaved=false;render()};saved.onclick=()=>{onlySaved=true;render()};render();</script></html>
