[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riverfmt"
version = "1.4.0"
requires-python = ">=3.10"
description = "Normalize row labels with bundled defaults"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
